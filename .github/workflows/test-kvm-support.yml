name: Test KVM Support on GitHub Actions

on:
  workflow_dispatch:

jobs:
  test-kvm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check hardware virtualization support
        run: |
          echo "=== Checking for hardware virtualization support ==="

          # Check if /dev/kvm exists (indicates KVM support)
          if [ -e /dev/kvm ]; then
            echo "✅ /dev/kvm exists"
            ls -la /dev/kvm
          else
            echo "❌ /dev/kvm does NOT exist"
          fi

          echo ""
          echo "=== CPU flags ==="
          # Check for virtualization CPU flags
          if grep -qE '(vmx|svm)' /proc/cpuinfo; then
            echo "✅ CPU supports virtualization (vmx=Intel VT-x or svm=AMD-V)"
            grep -E '(vmx|svm)' /proc/cpuinfo | head -1
          else
            echo "❌ CPU does NOT support virtualization"
          fi

          echo ""
          echo "=== Check if we're running in a VM ==="
          sudo apt-get update -qq
          sudo apt-get install -y virt-what
          sudo virt-what

          echo ""
          echo "=== System info ==="
          lscpu | grep -E "(Vendor|Model name|Virtualization|Hypervisor)"

          echo ""
          echo "=== Try to load KVM module ==="
          sudo modprobe kvm || echo "Failed to load KVM module"
          lsmod | grep kvm || echo "KVM module not loaded"
