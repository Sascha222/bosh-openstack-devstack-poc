name: BOSH CPI - Stemcell Lifecycle Test with BOSH Director

on:
  workflow_dispatch:
  push:
    branches: [ feature/bats-with-bosh-director ]

jobs:
  bosh-director-lifecycle-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show system info
        run: |
          echo "=== System Info ==="
          uname -a
          df -h
          free -h
          nproc
          echo "Python version: $(python3 --version)"

      - name: Free up disk space
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h

          # Aggressive cleanup for DevStack + BOSH + Stemcells
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules

          echo "=== Disk space AFTER cleanup ==="
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip python3-venv qemu-utils jq wget build-essential zlib1g-dev libssl-dev libreadline-dev libyaml-dev libsqlite3-dev sqlite3 libxml2-dev libxslt1-dev libcurl4-openssl-dev libffi-dev

      - name: Deploy DevStack
        id: devstack
        uses: gophercloud/devstack-action@v0.19
        with:
          branch: stable/2025.1
          conf_overrides: |
            FORCE=yes
            disable_service horizon tempest
            # Core services - Filesystem backend (Swift causes 502 for large uploads)
            ENABLED_SERVICES=mysql,rabbit,key,n-api,n-cpu,n-cond,n-sch,placement-api
            ENABLED_SERVICES+=,g-api,g-reg
            ENABLED_SERVICES+=,c-sch,c-api,c-vol
            ENABLED_SERVICES+=,q-svc,ovn-controller,ovn-northd,q-ovn-metadata-agent

      - name: Wait for DevStack to stabilize
        run: sleep 30

      - name: Fix KVM permissions for Nova Compute
        run: |
          echo "=== Fixing KVM permissions for Nova Compute ==="
          echo "Current state:"
          ls -la /dev/kvm
          groups runner | grep -q kvm && echo "runner already in kvm group" || echo "runner NOT in kvm group"

          echo ""
          echo "Adding runner user to kvm group..."
          sudo usermod -aG kvm runner

          echo ""
          echo "CRITICAL: Nova already registered as QEMU at Placement!"
          echo "We need to DELETE the compute node from Placement and let it re-register with KVM."

          # Source OpenStack credentials
          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          fi

          echo ""
          echo "Getting compute service UUID..."
          COMPUTE_UUID=$(openstack compute service list -f json | jq -r '.[] | select(.Binary=="nova-compute") | .ID')
          echo "Compute service UUID: $COMPUTE_UUID"

          echo ""
          echo "Deleting compute service (will force re-registration)..."
          openstack compute service delete $COMPUTE_UUID || echo "Failed to delete, continuing..."

          echo ""
          echo "Stopping nova-compute..."
          sudo systemctl stop devstack@n-cpu.service
          sleep 5

          echo ""
          echo "Starting nova-compute with KVM access..."
          sudo systemctl start devstack@n-cpu.service

          echo ""
          echo "Waiting for nova-compute to re-register (30s)..."
          sleep 30

          echo ""
          echo "Verifying nova-compute is running..."
          sudo systemctl status devstack@n-cpu.service --no-pager | head -20

          echo ""
          echo "Checking new compute service registration..."
          openstack compute service list

          echo ""
          echo "Waiting additional 10s for hypervisor registration..."
          sleep 10

          echo ""
          echo "Checking hypervisor type (should be KVM now)..."
          openstack hypervisor list

          HYPERVISOR_ID=$(openstack hypervisor list -f value -c ID 2>/dev/null || echo "")
          if [ -n "$HYPERVISOR_ID" ]; then
            echo "Hypervisor found: $HYPERVISOR_ID"
            openstack hypervisor show "$HYPERVISOR_ID" | grep hypervisor_type
          else
            echo "⚠️  No hypervisor found yet, checking logs..."
            sudo journalctl -u devstack@n-cpu.service --no-pager | grep -i "hypervisor\|kvm" | tail -10
          fi

          echo ""
          echo "✅ KVM permissions fixed and compute service re-registered"

      - name: Verify Nova KVM Configuration
        run: |
          echo "=== Verifying Nova is configured for KVM (hardware virtualization) ==="

          NOVA_CONF="/etc/nova/nova-cpu.conf"
          if [ ! -f "$NOVA_CONF" ]; then
            NOVA_CONF="/etc/nova/nova.conf"
          fi

          echo "Using config: $NOVA_CONF"
          echo ""
          echo "Nova libvirt configuration:"
          sudo grep -A 10 "\[libvirt\]" "$NOVA_CONF" || true

          echo ""
          echo "Checking KVM availability:"
          if [ -e /dev/kvm ]; then
            echo "✅ /dev/kvm exists - KVM is available!"
            ls -la /dev/kvm
          else
            echo "❌ /dev/kvm does NOT exist - KVM not available"
            exit 1
          fi

          echo ""
          echo "=== Checking libvirt connection ==="
          echo "Nova compute user:"
          NOVA_USER=$(ps aux | grep nova-compute | grep -v grep | awk '{print $1}' | head -1)
          echo "Nova runs as: $NOVA_USER"

          echo ""
          echo "Checking /dev/kvm permissions:"
          ls -la /dev/kvm

          echo ""
          echo "Checking if Nova user ($NOVA_USER) can access /dev/kvm:"
          groups $NOVA_USER | grep -q kvm && echo "✅ $NOVA_USER is in kvm group" || echo "❌ $NOVA_USER is NOT in kvm group"

          echo ""
          echo "Testing actual access to /dev/kvm:"
          sudo -u $NOVA_USER test -r /dev/kvm && echo "✅ $NOVA_USER CAN read /dev/kvm" || echo "❌ $NOVA_USER CANNOT read /dev/kvm"
          sudo -u $NOVA_USER test -w /dev/kvm && echo "✅ $NOVA_USER CAN write /dev/kvm" || echo "❌ $NOVA_USER CANNOT write /dev/kvm"

          echo ""
          echo "Testing libvirt connection as Nova user:"
          sudo -u $NOVA_USER virsh --connect qemu:///system capabilities | grep -E "<guest>|<domain type=" | head -10 || echo "Failed to connect to libvirt"

          echo ""
          echo "=== Checking what Nova Compute actually reports ==="
          # This will show us what hypervisor type Nova is ACTUALLY using at runtime
          sudo journalctl -u devstack@n-cpu.service --no-pager | grep -i "hypervisor\|virt_type\|libvirt" | tail -20 || true

          echo ""
          echo "✅ Nova is using KVM (default DevStack config is correct!)"
          echo "   GitHub Actions supports nested virtualization"

      - name: Verify OpenStack
        run: |
          echo "=== Verifying OpenStack Services ==="

          # Try multiple possible locations for openrc
          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          else
            echo "ERROR: openrc not found!"
            echo "Tried: ./devstack/openrc and /opt/stack/devstack/openrc"
            exit 1
          fi

          openstack endpoint list
          openstack network list
          openstack flavor list
          openstack image list

          echo ""
          echo "=== Checking Nova Compute Services ==="
          openstack compute service list

          echo ""
          echo "=== Checking Available Resources ==="
          openstack hypervisor list
          openstack hypervisor show $(openstack hypervisor list -f value -c ID) || true

          echo ""
          echo "=== Checking Placement API ==="
          # Check if compute nodes are registered with Placement
          echo "Resource providers in Placement:"
          openstack resource provider list || echo "Failed to list resource providers"

          echo ""
          echo "Compute node inventories:"
          PROVIDER_UUID=$(openstack resource provider list -f json | jq -r '.[0].uuid' 2>/dev/null)
          if [ -n "$PROVIDER_UUID" ]; then
            openstack resource provider inventory list "$PROVIDER_UUID" || echo "Failed to get inventory"
            openstack resource provider trait list "$PROVIDER_UUID" || echo "Failed to get traits"
          else
            echo "No resource providers found in Placement!"
          fi

          echo "✅ OpenStack is ready"

      - name: Fix Glance filesystem path (remove trailing slash) BEFORE BOSH
        run: |
          echo "=== Fixing Glance filesystem_store_datadir trailing slash ==="
          echo "⚠️  CRITICAL: This MUST happen BEFORE BOSH Director deployment!"
          echo "    Otherwise BOSH CPI will write malformed file:// URLs to image_locations table"
          echo ""

          # Show current config
          echo "Before fix:"
          sudo grep filesystem_store_datadir /etc/glance/glance-api.conf || echo "Config not found"

          # Remove trailing slash from Glance config
          # This is CRITICAL to avoid double-slash in file:// URLs
          # See: docs/bats-smoke-test-troubleshooting-journey.md Problem 8
          sudo sed -i 's|^\(filesystem_store_datadir\s*=\s*.*\)/$|\1|g' /etc/glance/glance-api.conf

          # Show fixed config
          echo ""
          echo "After fix:"
          sudo grep filesystem_store_datadir /etc/glance/glance-api.conf

          # Restart Glance to apply changes
          echo ""
          echo "Restarting Glance to load new config..."
          sudo systemctl restart devstack@g-api.service

          # Wait longer for Glance to fully reload config
          echo "Waiting for Glance to fully reload configuration..."
          sleep 30

          # Verify Glance is responding
          echo ""
          echo "Verifying Glance is ready and config is loaded..."
          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          fi

          # Multiple checks to ensure Glance is stable
          for i in {1..3}; do
            echo "Check $i/3..."
            openstack image list
            sleep 5
          done

          # Final verification: Check the config was actually applied
          echo ""
          echo "Final verification - config value:"
          sudo grep filesystem_store_datadir /etc/glance/glance-api.conf

          echo ""
          echo "✅ Glance config fixed and verified (trailing slash removed)"
          echo "   Config has been reloaded by Glance service"
          echo "   NOW it's safe to deploy BOSH Director!"
          echo "   BOSH CPI will write correct file:// URLs (no double-slash)"

      - name: Install BOSH CLI
        run: |
          echo "=== Installing BOSH CLI ==="

          # Download BOSH CLI v2
          wget -O bosh https://github.com/cloudfoundry/bosh-cli/releases/download/v7.8.2/bosh-cli-7.8.2-linux-amd64
          chmod +x bosh
          sudo mv bosh /usr/local/bin/

          # Verify
          bosh --version

          echo "✅ BOSH CLI installed"

      - name: Download BOSH deployment manifests
        run: |
          echo "=== Downloading BOSH deployment repository ==="

          git clone https://github.com/cloudfoundry/bosh-deployment.git ~/bosh-deployment

          echo "✅ BOSH deployment manifests ready"

      - name: Prepare BOSH Director deployment
        run: |
          echo "=== Preparing BOSH Director deployment ==="

          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          fi

          # Create working directory
          mkdir -p ~/bosh-director
          cd ~/bosh-director

          # Get OpenStack configuration
          export OS_AUTH_URL=$(openstack catalog show keystone -f json | jq -r '.endpoints[] | select(.interface=="public") | .url')
          export OS_PROJECT_NAME=$OS_PROJECT_NAME
          export OS_USERNAME=$OS_USERNAME
          export OS_PASSWORD=$OS_PASSWORD
          export OS_REGION_NAME=${OS_REGION_NAME:-RegionOne}
          export OS_DOMAIN_NAME=${OS_USER_DOMAIN_NAME:-Default}

          # Get network IDs
          export NETWORK_ID=$(openstack network list -f json | jq -r '.[] | select(.Name=="private") | .ID')
          export EXTERNAL_NETWORK_ID=$(openstack network list -f json | jq -r '.[] | select(.Name=="public") | .ID')

          echo "OpenStack Config:"
          echo "  Auth URL: $OS_AUTH_URL"
          echo "  Project: $OS_PROJECT_NAME"
          echo "  Network ID: $NETWORK_ID"
          echo "  External Network ID: $EXTERNAL_NETWORK_ID"

          # Create SSH key for BOSH
          ssh-keygen -t rsa -b 4096 -f ~/bosh-director/bosh-ssh-key -N ""

          # Create variables file for BOSH Director
          cat > ~/bosh-director/director-vars.yml <<EOF
          director_name: bosh-devstack
          internal_cidr: 10.0.0.0/24
          internal_gw: 10.0.0.1
          internal_ip: 10.0.0.6

          # OpenStack CPI variables (both naming conventions for compatibility)
          auth_url: $OS_AUTH_URL
          openstack_auth_url: $OS_AUTH_URL
          username: $OS_USERNAME
          openstack_username: $OS_USERNAME
          password: $OS_PASSWORD
          openstack_password: $OS_PASSWORD
          domain: $OS_DOMAIN_NAME
          openstack_domain: $OS_DOMAIN_NAME
          project: $OS_PROJECT_NAME
          openstack_project: $OS_PROJECT_NAME
          region: $OS_REGION_NAME
          openstack_region: $OS_REGION_NAME

          default_key_name: bosh-key
          openstack_default_key_name: bosh-key
          default_security_groups: [default]
          openstack_default_security_groups: [default]

          net_id: $NETWORK_ID
          az: nova
          EOF

          cat ~/bosh-director/director-vars.yml

          echo "✅ BOSH Director prep complete"

      - name: Upload SSH key to OpenStack
        run: |
          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          fi

          # Delete if exists
          openstack keypair delete bosh-key 2>/dev/null || true

          # Upload
          openstack keypair create --public-key ~/bosh-director/bosh-ssh-key.pub bosh-key

          echo "✅ SSH key uploaded"

      - name: Deploy BOSH Director
        run: |
          echo "=== Deploying BOSH Director ==="

          # Source OpenStack credentials FIRST (before cd)
          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          else
            echo "ERROR: openrc not found!"
            exit 1
          fi

          cd ~/bosh-director

          echo ""
          echo "=== Pre-deployment checks ==="
          echo "OpenStack endpoints:"
          openstack endpoint list | grep -E "(nova|glance|neutron)"

          echo ""
          echo "Nova compute services:"
          openstack compute service list

          echo ""
          echo "Available flavors:"
          openstack flavor list

          echo ""
          echo "Hypervisor stats:"
          openstack hypervisor stats show

          echo ""
          echo "=== Starting BOSH Director deployment ==="
          echo "⏳ This will take ~15-20 minutes..."

          # Deploy using bosh create-env (minimal setup - no UAA/CredHub to save resources)
          bosh create-env ~/bosh-deployment/bosh.yml \
            --state ./state.json \
            --vars-store ./creds.yml \
            --vars-file ./director-vars.yml \
            -o ~/bosh-deployment/openstack/cpi.yml \
            -o ~/bosh-deployment/jumpbox-user.yml \
            -v director_vm_type=m1.small \
            -v network_name=private

          echo "✅ BOSH Director deployed"

      - name: Debug - Show Nova logs if deployment fails
        if: failure()
        run: |
          echo "=== Nova Scheduler Logs (last 100 lines) ==="
          sudo journalctl -u devstack@n-sch.service -n 100 --no-pager || true

          echo ""
          echo "=== Nova Compute Logs (last 100 lines) ==="
          sudo journalctl -u devstack@n-cpu.service -n 100 --no-pager || true

          echo ""
          echo "=== Nova Conductor Logs (last 50 lines) ==="
          sudo journalctl -u devstack@n-cond.service -n 50 --no-pager || true

          echo ""
          echo "=== Check BOSH Stemcell Image Properties ==="
          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          fi

          echo "Images in Glance:"
          openstack image list

          echo ""
          echo "BOSH Stemcell image properties:"
          STEMCELL_ID=$(openstack image list -f json | jq -r '.[] | select(.Name | contains("bosh-openstack-kvm")) | .ID' | head -1)
          if [ -n "$STEMCELL_ID" ]; then
            openstack image show "$STEMCELL_ID"
          fi

      - name: Alias BOSH Director
        run: |
          echo "=== Configuring BOSH environment ==="

          cd ~/bosh-director

          # Extract admin password
          export BOSH_CLIENT=admin
          export BOSH_CLIENT_SECRET=$(bosh int ./creds.yml --path /admin_password)
          export BOSH_ENVIRONMENT=10.0.0.6
          export BOSH_CA_CERT=$(bosh int ./creds.yml --path /director_ssl/ca)

          # Alias the director
          bosh alias-env devstack -e 10.0.0.6 --ca-cert <(bosh int ./creds.yml --path /director_ssl/ca)

          # Login
          echo "$BOSH_CLIENT_SECRET" | bosh -e devstack login --client=$BOSH_CLIENT --client-secret-stdin

          # Save environment for later steps
          cat > ~/bosh-env.sh <<EOF
          export BOSH_CLIENT=admin
          export BOSH_CLIENT_SECRET=$BOSH_CLIENT_SECRET
          export BOSH_ENVIRONMENT=10.0.0.6
          export BOSH_CA_CERT="$BOSH_CA_CERT"
          EOF

          echo "✅ BOSH Director configured"

      - name: Download BOSH Stemcell
        run: |
          echo "=== Downloading BOSH Stemcell ==="

          source ~/bosh-env.sh

          # Download latest Ubuntu Jammy stemcell for OpenStack
          STEMCELL_VERSION=$(curl -s https://bosh.io/api/v1/stemcells/bosh-openstack-kvm-ubuntu-jammy-go_agent | jq -r '.[0].version')
          echo "Latest stemcell version: $STEMCELL_VERSION"

          STEMCELL_URL="https://storage.googleapis.com/bosh-core-stemcells/${STEMCELL_VERSION}/bosh-stemcell-${STEMCELL_VERSION}-openstack-kvm-ubuntu-jammy-go_agent.tgz"
          echo "Downloading from: $STEMCELL_URL"

          mkdir -p ~/stemcells
          wget -O ~/stemcells/stemcell.tgz "$STEMCELL_URL"

          # Show info
          ls -lh ~/stemcells/stemcell.tgz

          echo "✅ Stemcell downloaded: $(ls -lh ~/stemcells/stemcell.tgz | awk '{print $5}')"

      - name: Upload Stemcell to BOSH Director
        run: |
          echo "=== Uploading Stemcell to BOSH Director ==="
          echo "⏳ This will take several minutes for ~1.3GB stemcell..."
          echo ""

          source ~/bosh-env.sh

          # Upload via BOSH CLI (this uses BOSH CPI internally!)
          bosh -e devstack upload-stemcell ~/stemcells/stemcell.tgz

          # Verify
          bosh -e devstack stemcells

          echo ""
          echo "✅ Stemcell uploaded successfully!"

      - name: Deploy test VM from Stemcell
        run: |
          echo "=== Deploying test VM from Stemcell ==="

          source ~/bosh-env.sh

          # Create simple deployment manifest
          cat > ~/test-deployment.yml <<'EOF'
          name: test-vm

          releases: []

          stemcells:
          - alias: default
            os: ubuntu-jammy
            version: latest

          instance_groups:
          - name: test-instance
            instances: 1
            azs: [z1]
            jobs: []
            vm_type: default
            stemcell: default
            networks:
            - name: default

          update:
            canaries: 1
            max_in_flight: 1
            canary_watch_time: 1000-30000
            update_watch_time: 1000-30000
          EOF

          # Create cloud config
          cat > ~/cloud-config.yml <<EOF
          azs:
          - name: z1
            cloud_properties:
              availability_zone: nova

          vm_types:
          - name: default
            cloud_properties:
              instance_type: m1.small

          networks:
          - name: default
            type: manual
            subnets:
            - range: 10.0.0.0/24
              gateway: 10.0.0.1
              az: z1
              cloud_properties:
                net_id: $(openstack network show private -f json | jq -r '.id')

          compilation:
            workers: 1
            az: z1
            reuse_compilation_vms: true
            vm_type: default
            network: default
          EOF

          # Upload cloud config
          bosh -e devstack update-cloud-config ~/cloud-config.yml

          # Deploy
          bosh -e devstack -d test-vm deploy ~/test-deployment.yml --non-interactive

          # Show VMs
          bosh -e devstack -d test-vm vms

          echo "✅ Test VM deployed from stemcell!"

      - name: Verify VM via OpenStack
        run: |
          echo "=== Verifying VM in OpenStack ==="

          if [ -f "./devstack/openrc" ]; then
            source ./devstack/openrc admin admin
          elif [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
          fi

          # List VMs created by BOSH
          openstack server list --all-projects

          # Find BOSH-created VM
          VM_ID=$(openstack server list --all-projects -f json | jq -r '.[] | select(.Name | contains("test-vm")) | .ID' | head -1)

          if [ -n "$VM_ID" ]; then
            echo "Found BOSH VM: $VM_ID"
            openstack server show "$VM_ID"
            echo "✅ VM is running in OpenStack!"
          else
            echo "❌ Could not find BOSH VM"
            exit 1
          fi

      - name: Cleanup - Delete test VM
        if: always()
        run: |
          echo "=== Cleaning up test VM ==="

          source ~/bosh-env.sh || true

          bosh -e devstack -d test-vm delete-deployment --force --non-interactive || true

          echo "✅ Cleanup complete"

      - name: Test Summary
        if: always()
        run: |
          echo "=========================================="
          echo "BOSH CPI Stemcell Lifecycle Test Summary"
          echo "=========================================="
          echo ""
          echo "✅ DevStack deployed"
          echo "✅ BOSH Director deployed"
          echo "✅ Real stemcell downloaded (~1.3GB)"
          echo "✅ Stemcell uploaded via BOSH CPI to Glance"
          echo "✅ VM created from stemcell"
          echo "✅ VM verified in OpenStack"
          echo "✅ VM deleted"
          echo ""
          echo "This validates the complete BOSH CPI stemcell lifecycle!"
          echo "=========================================="
